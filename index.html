<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大小排序</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --text:#1f2937; --muted:#6b7280; --line:#dbe1ee;
  --accent:#2563eb; --accent-text:#fff; --good:#16a34a; --bad:#dc2626; --good-bg:#dcfce7; --bad-bg:#fee2e2;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f172a;--panel:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--accent:#3b82f6;--good-bg:#14532d;--bad-bg:#7f1d1d;--good:#4ade80;--bad:#f87171}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:22px;margin:0 16px 0 0}
nav button{font-size:16px;padding:8px 20px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{padding:20px 24px;max-width:1500px;margin:auto}
.hidden{display:none!important}
button.btn{font:inherit;font-size:16px;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}

/* deck */
.addform input.name{width:200px}.addform input.val{width:120px}.addform input.unit{width:90px}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.dcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.dcard .pic{height:100px;border-radius:8px;background:var(--panel);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px}
.dcard .pic img{width:100%;height:100%;object-fit:contain}
.dcard input{width:100%;padding:4px 8px;font-size:15px}
.dcard .two{display:flex;gap:6px}
.dcard .acts{display:flex;gap:6px;justify-content:space-between}
.dcard .acts button{font-size:13px;padding:3px 8px}

/* game */
.setup{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stats{display:flex;gap:28px;font-size:22px;margin:8px 0 16px;flex-wrap:wrap}
.stats b{font-size:30px;color:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:22px;font-weight:700;color:var(--muted);margin:6px 4px}
.line{display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;min-height:260px;padding:16px;border-radius:14px;background:var(--panel);border:2px dashed var(--line)}
.gcard{flex:1 1 0;min-width:140px;max-width:260px;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:grab;user-select:none;text-align:center}
.gcard .img{width:100%;height:150px;object-fit:contain;border-radius:8px;pointer-events:none}
.gcard .nm{font-size:clamp(20px,2.6vw,36px);font-weight:700;word-break:break-word}
.gcard .num{font-size:clamp(20px,2.4vw,32px);font-weight:700;display:none}
.revealed .gcard{cursor:default}
.revealed .gcard .num{display:block}
.gcard.ok{border-color:var(--good);background:var(--good-bg)}
.gcard.no{border-color:var(--bad);background:var(--bad-bg)}
.gcard.ghost{opacity:.4}
.gcard .rank{font-size:16px;color:var(--muted);display:none}
.revealed .gcard .rank{display:block}
.result{font-size:26px;font-weight:700;margin:16px 0 8px;text-align:center}
.answer{margin-top:10px}
.answer .line{min-height:0;border-style:solid}
.answer .gcard{cursor:default;border-color:var(--good)}
.answer .gcard .num{display:block}
.controls{display:flex;gap:12px;justify-content:center;margin-top:16px}
.controls .btn{font-size:20px;padding:12px 32px}
.empty{text-align:center;padding:60px;color:var(--muted);font-size:18px}
</style>
</head>
<body>
<header>
  <h1>📏 大小排序</h1>
  <nav>
    <button id="tabGame" class="on">遊戲</button>
    <button id="tabDeck">題庫管理</button>
  </nav>
</header>
<main>

<!-- 題庫管理 -->
<section id="deckView" class="hidden">
  <div class="panel">
    <div class="row">
      <button class="btn primary" id="btnImport">匯入題庫</button>
      <button class="btn" id="btnExport">匯出全部題庫</button>
      <button class="btn" id="btnTemplate">下載範本檔</button>
      <button class="btn danger" id="btnClear">清空全部</button>
      <span class="muted" id="deckCount"></span>
      <input type="file" id="fileImport" accept=".csv,.xlsx,.xls,.txt,.json" class="hidden">
    </div>
    <p class="muted">匯入支援 CSV、Excel,以及本 App 匯出的題庫檔(.json,含圖片,適合備份或給其他老師)。CSV/Excel 欄位順序:主題、名稱、數值、單位(單位可省略),主題不存在會自動建立;若檔案沒有「主題」欄(名稱、數值、單位),則匯入目前選取的主題。名稱可加 emoji,例如「🍎 蘋果」。圖片請在下方各卡片上傳。資料儲存在這台電腦的瀏覽器中。</p>
  </div>
  <div class="panel">
    <div class="row">
      <b>主題</b>
      <select id="selTopicEdit" style="min-width:200px"></select>
      <button class="btn" id="btnTopicAdd">新增主題</button>
      <button class="btn" id="btnTopicRename">重新命名</button>
      <button class="btn" id="btnTopicExport">匯出此主題</button>
      <button class="btn danger" id="btnTopicDel">刪除主題</button>
    </div>
  </div>
  <div class="panel">
    <div class="row addform">
      <b>新增卡片到此主題</b>
      <input class="name" id="addName" placeholder="名稱(例如 🍎 蘋果)">
      <input class="val" id="addVal" type="number" step="any" placeholder="數值">
      <input class="unit" id="addUnit" placeholder="單位">
      <button class="btn primary" id="btnAdd">新增</button>
    </div>
  </div>
  <div class="deck" id="deckList"></div>
  <input type="file" id="fileImg" accept="image/*" class="hidden">
</section>

<!-- 遊戲 -->
<section id="gameView">
  <div class="panel setup">
    <label>一次排 <select id="selN"></select> 張</label>
    <label>方向
      <select id="selDir"><option value="asc">由小到大</option><option value="desc">由大到小</option></select>
    </label>
    <label>主題 <select id="selTopic" style="min-width:160px"></select></label>
    <button class="btn primary" id="btnStart">開始新回合</button>
    <button class="btn" id="btnResetScore">重設計分</button>
  </div>
  <div id="gameEmpty" class="empty hidden">此主題的卡片不足 2 張,請換一個主題,或到「題庫管理」新增卡片。</div>
  <div id="gameArea" class="hidden">
    <div class="stats">
      <div>⏱ 本回合 <b id="timer">0:00</b></div>
      <div>回合 <b id="roundNo">0</b></div>
      <div>累計得分 <b id="totalScore">0</b> / <span id="totalMax">0</span></div>
    </div>
    <div class="axis"><span id="axL"></span><span id="axR"></span></div>
    <div class="line" id="line"></div>
    <div class="result hidden" id="result"></div>
    <div class="answer hidden" id="answerBox">
      <div class="muted" style="text-align:center">正確順序</div>
      <div class="line" id="answerLine"></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="btnReveal">揭曉答案</button>
      <button class="btn primary hidden" id="btnNext">下一回合</button>
    </div>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = 'orderline.topics.v2', OLD_KEY = 'orderline.deck.v1';
let topics = [];          // {id,name,cards:[{id,name,value,unit,img}]}
let curId = null;         // 題庫管理中選取的主題
let imgTarget = null;     // id of card receiving image
let state = null;         // current round
let score = {total:0, max:0, round:0};
let timerId = null, sortable = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const cur = () => topics.find(t => t.id === curId);

/* ---------- storage ---------- */
function load(){
  try{ topics = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ topics = []; }
  if(!topics.length){
    // 從舊版單一題庫轉換
    try{
      const old = JSON.parse(localStorage.getItem(OLD_KEY)) || [];
      if(old.length) topics = [{id:uid(), name:'我的題庫', cards:old}];
    }catch(e){}
  }
  if(!topics.length) topics = [{id:uid(), name:'主題 1', cards:[]}];
  curId = topics[0].id;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(topics)); }
  catch(e){ alert('瀏覽器儲存空間不足,部分資料可能未儲存。請移除一些圖片。'); }
}

/* ---------- tabs ---------- */
function showTab(t){
  $('tabGame').classList.toggle('on', t==='game');
  $('tabDeck').classList.toggle('on', t==='deck');
  $('gameView').classList.toggle('hidden', t!=='game');
  $('deckView').classList.toggle('hidden', t!=='deck');
  if(t==='deck') renderDeck(); else refreshSetup();
}
$('tabGame').onclick = () => showTab('game');
$('tabDeck').onclick = () => showTab('deck');

/* ---------- topics ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function topicOptions(sel, selectedId){
  sel.innerHTML = topics.map(t => `<option value="${t.id}">${esc(t.name)}(${t.cards.length})</option>`).join('');
  sel.value = selectedId;
}
function findOrCreateTopic(name){
  name = name.trim() || '未分類';
  let t = topics.find(x => x.name === name);
  if(!t){ t = {id:uid(), name, cards:[]}; topics.push(t); }
  return t;
}
$('selTopicEdit').onchange = e => { curId = e.target.value; renderDeck(); };
$('btnTopicAdd').onclick = () => {
  const name = (prompt('新主題名稱:') || '').trim();
  if(!name) return;
  if(topics.some(t => t.name === name)){ alert('已有同名的主題'); return; }
  const t = {id:uid(), name, cards:[]}; topics.push(t); curId = t.id; save(); renderDeck();
};
$('btnTopicRename').onclick = () => {
  const t = cur(), name = (prompt('主題名稱:', t.name) || '').trim();
  if(!name || name === t.name) return;
  if(topics.some(x => x.name === name)){ alert('已有同名的主題'); return; }
  t.name = name; save(); renderDeck();
};
$('btnTopicDel').onclick = () => {
  const t = cur();
  if(!confirm(`確定要刪除主題「${t.name}」及其 ${t.cards.length} 張卡片嗎?`)) return;
  topics = topics.filter(x => x.id !== t.id);
  if(!topics.length) topics = [{id:uid(), name:'主題 1', cards:[]}];
  curId = topics[0].id; save(); renderDeck();
};

/* ---------- deck view ---------- */
function renderDeck(){
  topicOptions($('selTopicEdit'), curId);
  const deck = cur().cards;
  $('deckCount').textContent = `此主題 ${deck.length} 張卡片,共 ${topics.length} 個主題`;
  $('deckList').innerHTML = deck.map(c => `
    <div class="dcard" data-id="${c.id}">
      <div class="pic">${c.img ? `<img src="${c.img}" alt="">` : '無圖片'}</div>
      <input data-f="name" value="${esc(c.name)}" placeholder="名稱">
      <div class="two">
        <input data-f="value" type="number" step="any" value="${c.value}" placeholder="數值">
        <input data-f="unit" value="${esc(c.unit||'')}" placeholder="單位">
      </div>
      <div class="acts">
        <button class="btn" data-a="img">${c.img ? '更換圖片' : '上傳圖片'}</button>
        ${c.img ? '<button class="btn" data-a="rmimg">移除圖片</button>' : ''}
        <button class="btn danger" data-a="del">刪除</button>
      </div>
    </div>`).join('');
}

$('deckList').addEventListener('change', e => {
  const f = e.target.dataset.f; if(!f) return;
  const c = cur().cards.find(x => x.id === e.target.closest('.dcard').dataset.id);
  if(f === 'value'){
    const v = parseFloat(e.target.value);
    if(isNaN(v)){ e.target.value = c.value; return; }
    c.value = v;
  } else c[f] = e.target.value;
  save();
});
$('deckList').addEventListener('click', e => {
  const a = e.target.dataset.a; if(!a) return;
  const id = e.target.closest('.dcard').dataset.id;
  const t = cur(), c = t.cards.find(x => x.id === id);
  if(a === 'del'){ t.cards = t.cards.filter(x => x.id !== id); save(); renderDeck(); }
  else if(a === 'rmimg'){ c.img = null; save(); renderDeck(); }
  else if(a === 'img'){ imgTarget = id; $('fileImg').value = ''; $('fileImg').click(); }
});

function resizeImage(file, max=360){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const r = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r);
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
$('fileImg').onchange = async e => {
  const f = e.target.files[0]; if(!f || !imgTarget) return;
  try{
    const c = cur().cards.find(x => x.id === imgTarget);
    c.img = await resizeImage(f); save(); renderDeck();
  }catch(err){ alert('無法讀取這張圖片'); }
};

$('btnAdd').onclick = () => {
  const name = $('addName').value.trim(), v = parseFloat($('addVal').value);
  if(!name || isNaN(v)){ alert('請輸入名稱與數值'); return; }
  cur().cards.push({id:uid(), name, value:v, unit:$('addUnit').value.trim(), img:null});
  save(); renderDeck();
  $('addName').value = ''; $('addVal').value = ''; $('addName').focus();
};
$('addVal').addEventListener('keydown', e => { if(e.key==='Enter') $('btnAdd').click(); });

$('btnClear').onclick = () => {
  if(confirm('確定要清空所有主題與卡片嗎?此動作無法復原。')){
    topics = [{id:uid(), name:'主題 1', cards:[]}]; curId = topics[0].id; save(); renderDeck();
  }
};

/* ---------- import / export ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if(ch === '"') q = true;
    else if(ch === ','){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function summary(added, skipped, extra=''){
  alert(`已匯入 ${added} 張卡片` + extra + (skipped ? `,略過 ${skipped} 筆無效或重複資料` : ''));
}
function addRows(rows){
  // 第一欄標題為「主題」→ 四欄格式(主題,名稱,數值,單位);否則三欄格式匯入目前主題
  const withTopic = rows.length && /^(主題|topic)$/i.test(String(rows[0][0]).trim());
  const before = topics.length;
  let added = 0, skipped = 0;
  rows.forEach((r, i) => {
    const [tp, name, val, unit] = withTopic ? [r[0], r[1], r[2], r[3]] : [null, r[0], r[1], r[2]];
    const n = String(name ?? '').trim(), v = parseFloat(String(val ?? '').replace(/,/g, ''));
    if(!n || isNaN(v)){ if(i > 0) skipped++; return; }   // 第一列非數值視為標題
    const t = withTopic ? findOrCreateTopic(String(tp ?? '')) : cur();
    t.cards.push({id:uid(), name:n, value:v, unit:String(unit ?? '').trim(), img:null});
    added++;
  });
  save(); renderDeck();
  summary(added, skipped, topics.length > before ? `,新增 ${topics.length - before} 個主題` : '');
}
function importJSON(text){
  const data = JSON.parse(text);
  // 新版 {topics:[...]};舊版 {cards:[...]} 或純陣列 → 匯入目前主題
  const groups = Array.isArray(data.topics) ? data.topics
    : [{name:null, cards:Array.isArray(data) ? data : data.cards}];
  if(groups.some(g => !g || !Array.isArray(g.cards))) throw new Error('format');
  const before = topics.length;
  let added = 0, skipped = 0;
  groups.forEach(g => {
    const t = g.name ? findOrCreateTopic(String(g.name)) : cur();
    const have = new Set(t.cards.map(c => c.id));
    g.cards.forEach(c => {
      const v = parseFloat(c && c.value);
      if(!c || !String(c.name || '').trim() || isNaN(v) || (c.id && have.has(c.id))){ skipped++; return; }
      const img = typeof c.img === 'string' && c.img.startsWith('data:image/') ? c.img : null;
      t.cards.push({id:c.id || uid(), name:String(c.name).trim(), value:v, unit:String(c.unit || '').trim(), img});
      added++;
    });
  });
  save(); renderDeck();
  summary(added, skipped, topics.length > before ? `,新增 ${topics.length - before} 個主題` : '');
}
$('btnImport').onclick = () => { $('fileImport').value = ''; $('fileImport').click(); };
$('fileImport').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    if(/\.json$/i.test(f.name)) importJSON(await f.text());
    else if(/\.xlsx?$/i.test(f.name)){
      if(typeof XLSX === 'undefined'){ alert('Excel 讀取元件未載入(可能沒有網路),請改用 CSV。'); return; }
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      addRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''}));
    } else addRows(parseCSV(await f.text()));
  }catch(err){ alert('檔案讀取失敗,請確認格式。'); }
};
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportTopics(list, label){
  if(!list.some(t => t.cards.length)){ alert('沒有可匯出的卡片'); return; }
  download(new Blob([JSON.stringify({app:'order-line', version:2, topics:list})], {type:'application/json'}),
           `${label}-${new Date().toISOString().slice(0,10)}.json`);
}
$('btnExport').onclick = () => exportTopics(topics, '題庫');
$('btnTopicExport').onclick = () => exportTopics([cur()], '題庫-' + cur().name.replace(/[\/:*?"<>|]/g, '_'));
$('btnTemplate').onclick = () => {
  const csv = '主題,名稱,數值,單位\n食物含糖量,🥤 可樂 (350ml),37,g\n食物含糖量,🍪 餅乾 (1片),4,g\n食物含糖量,🍎 蘋果 (1顆),19,g\n食物含糖量,🍫 巧克力 (1條),25,g\n動物體重,🐘 大象,5000,kg\n動物體重,🐈 貓,4,kg\n動物體重,🐕 狗,20,kg\n動物體重,🐇 兔子,2,kg\n';
  download(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}), '題庫範本.csv');
};

/* ---------- game ---------- */
function gameTopic(){ return topics.find(t => t.id === $('selTopic').value) || topics[0]; }
function refreshSetup(){
  const prev = $('selTopic').value;
  topicOptions($('selTopic'), topics.some(t => t.id === prev) ? prev : (topics.find(t => t.cards.length >= 2) || topics[0]).id);
  refreshN();
}
function refreshN(){
  const t = gameTopic(), sel = $('selN'), prevN = +sel.value || 4, max = Math.min(t.cards.length, 12);
  sel.innerHTML = '';
  for(let i = 2; i <= Math.max(max, 2); i++) sel.add(new Option(i, i));
  sel.value = Math.min(prevN, Math.max(max, 2));
  const ok = t.cards.length >= 2;
  $('gameEmpty').classList.toggle('hidden', ok);
  $('btnStart').disabled = !ok;
  if(!ok) $('gameArea').classList.add('hidden');
}
$('selTopic').onchange = refreshN;

function fmt(c){ return `${c.value}${c.unit ? ' ' + c.unit : ''}`; }
function cardHTML(c){
  return `<div class="gcard" data-id="${c.id}">
    <div class="rank"></div>
    ${c.img ? `<img class="img" src="${c.img}" alt="">` : ''}
    <div class="nm">${esc(c.name)}</div>
    <div class="num">${esc(fmt(c))}</div>
  </div>`;
}
function fmtTime(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function startRound(){
  const t = gameTopic(), deck = t.cards;
  if(deck.length < 2) return;
  const n = Math.min(+$('selN').value, deck.length);
  const pool = [...deck];
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const cards = pool.slice(0, n);
  const dir = $('selDir').value;
  // 避免一開始就剛好排好
  const sorted = [...cards].sort((a,b) => dir==='asc' ? a.value-b.value : b.value-a.value);
  let shuffled = [...cards];
  if(n > 1 && new Set(cards.map(c => c.value)).size > 1){
    for(let k = 0; k < 20 && shuffled.every((c,i) => c.value === sorted[i].value); k++)
      shuffled.sort(() => Math.random() - .5);
  }
  state = {cards:shuffled, sorted, dir, revealed:false, start:Date.now(), elapsed:0};
  score.round++;
  const big = dir==='asc' ? '小' : '大', small = dir==='asc' ? '大' : '小';
  $('axL').textContent = `← ${t.name} ${big}`;
  $('axR').textContent = `${t.name} ${small} →`;

  $('line').classList.remove('revealed');
  $('line').innerHTML = shuffled.map(cardHTML).join('');
  $('result').classList.add('hidden');
  $('answerBox').classList.add('hidden');
  $('btnReveal').classList.remove('hidden');
  $('btnNext').classList.add('hidden');
  $('gameArea').classList.remove('hidden');
  $('roundNo').textContent = score.round;
  updateScore();

  if(sortable) sortable.destroy();
  sortable = Sortable.create($('line'), {animation:150, ghostClass:'ghost', forceFallback:false, delay:80, delayOnTouchOnly:true, touchStartThreshold:4});

  clearInterval(timerId);
  $('timer').textContent = '0:00';
  timerId = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.start)/1000);
    $('timer').textContent = fmtTime(state.elapsed);
  }, 250);
}

function updateScore(){
  $('totalScore').textContent = score.total;
  $('totalMax').textContent = score.max;
}

function reveal(){
  if(!state || state.revealed) return;
  state.revealed = true;
  clearInterval(timerId);
  state.elapsed = Math.floor((Date.now() - state.start)/1000);
  $('timer').textContent = fmtTime(state.elapsed);
  if(sortable) sortable.option('disabled', true);

  const els = [...$('line').children];
  let right = 0;
  els.forEach((el, i) => {
    const card = state.cards.find(c => c.id === el.dataset.id);
    const ok = card.value === state.sorted[i].value;   // 數值相同(並列)任何順序皆算對
    if(ok) right++;
    el.classList.add(ok ? 'ok' : 'no');
    el.querySelector('.rank').textContent = ok ? '✔ 正確' : '✘ 錯誤';
  });
  $('line').classList.add('revealed');
  score.total += right; score.max += els.length; updateScore();

  const all = right === els.length;
  $('result').textContent = all ? `🎉 全對!用時 ${fmtTime(state.elapsed)}` : `答對 ${right} / ${els.length} 張,用時 ${fmtTime(state.elapsed)}`;
  $('result').classList.remove('hidden');
  if(!all){
    $('answerLine').classList.add('revealed');
    $('answerLine').innerHTML = state.sorted.map(cardHTML).join('');
    $('answerBox').classList.remove('hidden');
  }
  $('btnReveal').classList.add('hidden');
  $('btnNext').classList.remove('hidden');
}

$('btnStart').onclick = startRound;
$('btnNext').onclick = startRound;
$('btnReveal').onclick = reveal;
$('btnResetScore').onclick = () => { score = {total:0, max:0, round:0}; $('roundNo').textContent = 0; updateScore(); };

/* ---------- init ---------- */
load();
refreshSetup();
</script>
</body>
</html>
